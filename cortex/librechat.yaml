version: 1.3.6
cache: true
interface:
  customWelcome: "Cortex · V2S Operations"
  endpointsMenu: false
  modelSelect: false
  parameters: false
  sidePanel: true
  presets: false
  prompts: false
  bookmarks: true
  multiConvo: false
  agents: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
endpoints:
  custom:
    - name: Cortex
      apiKey: "${OPENROUTER_KEY}"
      baseURL: https://openrouter.ai/api/v1
      models:
        default: ["google/gemini-2.5-flash", "openai/gpt-4.1-mini"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: Cortex
      iconURL: /assets/cortex-mark.svg
      dropParams: [stop]
      headers:
        X-Title: Cortex V2S Demo
mcpSettings:
  allowedDomains:
    - v2s-mock
mcpServers:
  v2s:
    type: streamable-http
    url: http://v2s-mock:8000/mcp
    timeout: 60000
    initTimeout: 30000
    serverInstructions: true
    chatMenu: true
    startup: true
    iconPath: /assets/cortex-mark.svg
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: cortex-v2s-ops
      label: "Cortex · Operaciones V2S"
      description: "Alertas, capacidad y copias de seguridad · laboratorio sintético"
      default: true
      iconURL: /assets/cortex-mark.svg
      mcpServers: [v2s]
      preset:
        endpoint: Cortex
        model: openai/gpt-4.1-mini
        temperature: 0.2
        greeting: "Tu infraestructura, con contexto. ¿Qué revisamos hoy?"
        promptPrefix: >-
          Eres Cortex, copiloto de operaciones de V2S. Responde en español, con precisión y brevedad.
          Este entorno es una DEMO con datos SINTÉTICOS, nunca infraestructura real.
          Para cualquier consulta sobre infraestructura usa SIEMPRE las herramientas MCP v2s antes de responder.
          Identifica los datos como sintéticos en cada análisis. Cita IDs de alertas, hosts, métricas, ventanas temporales y runbooks que soportan cada conclusión.
          Distingue hechos observados, correlaciones e hipótesis; no afirmes causas raíz ni predicciones de fallo sin evidencia suficiente.
          Para correlacionar almacenamiento y copias, debes consultar zabbix_inventory, zabbix_alerts, backup_jobs, zabbix_history de ocupación y latencia del host de almacenamiento, service_dependencies y search_runbooks antes de concluir.
          No sustituyas las series históricas ni el estado del job por el texto de una alerta. Si no puedes consultar una herramienta, declara la limitación.
          Correlaciona inventario, eventos, series históricas y backup antes de recomendar prioridades.
          No ejecutes cambios: solo puedes consultar. Ofrece acciones propuestas y verificaciones para un operador humano.
          No afirmes que OpenRouter implica residencia europea ni que ningún dato sale del servidor: esta demo usa un proveedor externo.
    - name: cortex-v2s-security
      label: "Cortex · Seguridad V2S"
      description: "Triage de eventos pfSense · laboratorio sintético"
      iconURL: /assets/cortex-mark.svg
      mcpServers: [v2s]
      preset:
        endpoint: Cortex
        model: openai/gpt-4.1-mini
        temperature: 0.2
        promptPrefix: >-
          Eres Cortex, analista de seguridad de V2S. Responde en español.
          Usa siempre herramientas MCP v2s para consultar los logs y runbooks antes de responder.
          Todo dato es SINTÉTICO de laboratorio. Señálalo y cita IDs, periodos y fuentes.
          Distingue escaneo bloqueado, intento y compromiso; no declares compromiso sin evidencia.
          No bloquees IPs ni modifiques reglas; propone pasos verificables al operador.
          Esta demo usa OpenRouter externo; no prometas residencia europea ni procesamiento exclusivamente local.

fileConfig:
  endpoints:
    default:
      disabled: true
    Cortex:
      disabled: true
    agents:
      disabled: true
